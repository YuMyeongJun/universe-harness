<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" role="img" aria-label="우주의 기관과 흐름">
  <style>
    .t{font:600 14px system-ui,-apple-system,sans-serif;fill:#e8e8f0}
    .s{font:11.5px system-ui,-apple-system,sans-serif;fill:#a0a0b8}
    .b{fill:#1e1e2e;stroke-width:1.5;rx:9}
    .l{stroke-width:2;fill:none}
  </style>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 z" fill="#8b8bb8"/></marker></defs>

  <rect x="20" y="24" width="170" height="76" class="b" stroke="#f9a8d4"/>
  <text x="36" y="50" class="t">⚛ 법칙</text>
  <text x="36" y="70" class="s">무엇이 옳은가</text>
  <text x="36" y="88" class="s">배달된다 · 은하를 모른다</text>

  <rect x="230" y="24" width="170" height="76" class="b" stroke="#fcd34d"/>
  <text x="246" y="50" class="t">🜂 힘</text>
  <text x="246" y="70" class="s">누가 하는가</text>
  <text x="246" y="88" class="s">배달되지 않는다 · 명부만</text>

  <rect x="440" y="24" width="170" height="76" class="b" stroke="#86efac"/>
  <text x="456" y="50" class="t">🛰 궤도</text>
  <text x="456" y="70" class="s">어떻게 반복되는가</text>
  <text x="456" y="88" class="s">한 바퀴의 끝이 있다</text>

  <rect x="230" y="150" width="380" height="86" class="b" stroke="#7dd3fc"/>
  <text x="248" y="176" class="t">🔭 관측소 — 형식이 아니라 동작을 잰다</text>
  <text x="248" y="198" class="s">관문(변경분) → 게이트(lint · build · test · typecheck)</text>
  <text x="248" y="218" class="s">이것이 앞선 정원들에 없던 축이다</text>

  <rect x="20" y="150" width="170" height="86" class="b" stroke="#c4b5fd"/>
  <text x="36" y="176" class="t">🌫 성운</text>
  <text x="36" y="196" class="s">아직 법칙이 아닌 관측</text>
  <text x="36" y="216" class="s">평가에서 승격돼 온다</text>

  <rect x="640" y="150" width="120" height="86" class="b" stroke="#fda4af"/>
  <text x="656" y="176" class="t">📻 전파</text>
  <text x="656" y="196" class="s">저장소 → 위키</text>
  <text x="656" y="216" class="s">한 방향뿐</text>

  <path d="M190 62 L228 62" class="l" stroke="#8b8bb8" marker-end="url(#m)"/>
  <path d="M400 62 L438 62" class="l" stroke="#8b8bb8" marker-end="url(#m)"/>
  <path d="M420 100 L420 148" class="l" stroke="#8b8bb8" marker-end="url(#m)"/>
  <path d="M228 193 L192 193" class="l" stroke="#8b8bb8" marker-end="url(#m)"/>
  <path d="M105 150 L105 105 L105 100" class="l" stroke="#c4b5fd" stroke-dasharray="4 3" marker-end="url(#m)"/>
  <text x="112" y="128" class="s">승격</text>
  <path d="M612 193 L638 193" class="l" stroke="#8b8bb8" marker-end="url(#m)"/>
</svg>
