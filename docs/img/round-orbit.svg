<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="라운드 궤도">
  <style>
    .t{font:600 13px system-ui,-apple-system,sans-serif;fill:#e8e8f0}
    .s{font:11px system-ui,-apple-system,sans-serif;fill:#a0a0b8}
    .h{font:600 12px system-ui,-apple-system,sans-serif;fill:#fcd34d}
    .b{fill:#1e1e2e;stroke:#5b5b85;stroke-width:1.5;rx:8}
    .l{stroke:#8b8bb8;stroke-width:2;fill:none}
  </style>
  <defs><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0 L9 4.5 L0 9 z" fill="#8b8bb8"/></marker></defs>

  <rect x="16" y="40" width="118" height="56" class="b"/>
  <text x="30" y="64" class="t">① 작업</text><text x="30" y="84" class="s">하나만 바꾼다</text>

  <rect x="164" y="40" width="118" height="56" class="b"/>
  <text x="178" y="64" class="t">② 검사</text><text x="178" y="84" class="s">파이프 없이</text>

  <rect x="312" y="40" width="118" height="56" class="b"/>
  <text x="326" y="64" class="t">③ 로그</text><text x="326" y="84" class="s">실행·결과·평가</text>

  <rect x="460" y="40" width="118" height="56" class="b"/>
  <text x="474" y="64" class="t">④ 평가</text><text x="474" y="84" class="s">축/판정/근거</text>

  <rect x="460" y="150" width="240" height="60" class="b" stroke="#fcd34d"/>
  <text x="476" y="174" class="h">⑤ 낮은 축 → 성운으로 승격</text>
  <text x="476" y="194" class="s">이 단계가 궤도를 닫는다 — L5 의 조건</text>

  <rect x="16" y="150" width="240" height="60" class="b" stroke="#c4b5fd"/>
  <text x="32" y="174" class="t">⑥ 다음 바퀴</text>
  <text x="32" y="194" class="s">성운에서 꺼내 ① 로</text>

  <path d="M134 68 L162 68" class="l" marker-end="url(#r)"/>
  <path d="M282 68 L310 68" class="l" marker-end="url(#r)"/>
  <path d="M430 68 L458 68" class="l" marker-end="url(#r)"/>
  <path d="M519 96 L519 148" class="l" marker-end="url(#r)"/>
  <path d="M458 180 L258 180" class="l" marker-end="url(#r)"/>
  <path d="M136 150 L136 120 L75 120 L75 98" class="l" stroke="#c4b5fd" marker-end="url(#r)"/>

  <text x="16" y="232" class="s">⛔ 승격하지 않으면 평가는 장식이고, 로그에만 남은 제안은 실행되지 않는다.</text>
</svg>
