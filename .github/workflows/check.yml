# 관문 — PR 과 main 에서 **전부** 돈다.
#
# ⚠️⚠️ 나누지 않았다. 그것이 이 파일의 유일한 설계 결정이고, **재고 나서** 정했다(R154).
# 계획은 「빠른 것/느린 것으로 나눈다」였는데 실측이 그 전제를 뒤집었다:
#
#     관문 25개 합계 ~53초 · 그중 `검사가 무는가` 하나가 **39.7초(75%)**
#     나머지 24개는 전부 4초 이하 (빌드를 돌리는 것들조차 — 광속 한계 1.2초 · 3차 배선 3.8초)
#     엔진 빌드는 **2초**
#
# ⇒ 나눌 것이 없다. 무거운 것 하나가 가장 값진 것(변이 시험)이라 뺄 수도 없다.
# ⛔ 짐작으로 나눴으면 **가장 값진 검사를 야간으로 밀어 놓고** CI 를 세웠다고 했을 것이다.
#
# ⚠️ `verify-wiki` 는 여기 없다 — 관문 목록(`lib/gates.mjs`)에 애초에 없다.
#    네트워크와 위키 초기화가 필요해서 CI 에선 「못 쟀다」로 지나간다(R151).
#    **재는 척하는 칸을 만들지 않는다.**
name: 관문

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # engines 가 >=22.6 이다. 로컬은 26 이라 **다른 판에서 도는지는 CI 가 처음 잰다.**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 설치 자리는 둘이다 — 뿌리엔 lock 이 없다(의존성 0).
      - name: 의존성 — 엔진
        run: npm ci
        working-directory: observatory/engine

      # ⚠️ 픽스처도 깔아야 한다. 게이트가 이 은하에서 **진짜로** build·test·typecheck 를 돌린다.
      - name: 의존성 — 픽스처 은하
        run: npm ci
        working-directory: fixtures/tiny-galaxy

      # ⛔ 산출물(dist)이 없으면 엔진이 필요한 관문들이 「엔진이 없어서 못 쟀다」로 조용히 지나간다.
      #    그러면 CI 는 초록불인데 **아무것도 안 잰 것**이 된다(§8). 그래서 빌드가 먼저다.
      - name: 엔진 빌드
        run: npm run build
        working-directory: observatory/engine

      # ⛔ 출력을 파이프로 걸러 보지 않는다(R127) — 파이프 뒤 종료코드는 마지막 명령의 것이다.
      - name: 관문 25개
        run: node bin/check.mjs
